<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__APP_TITLE__</title>
  <script>window.onerror=function(message,source,line){window.addEventListener('DOMContentLoaded',function(){var box=document.getElementById('errorBanner');if(box){box.style.display='block';box.textContent='El navegador no pudo iniciar los controles: '+message+' (línea '+line+'). Abre el archivo con Edge, Chrome o Firefox.';}});};</script>
  <style>
    :root { --ink:#17212b; --muted:#65717d; --line:#d8dee4; --paper:#fff; --bg:#f3f5f7; --accent:#176b87; --include:#26734d; --background:#916319; --exclude:#a53b3b; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--bg); font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; }
    header { position:sticky; top:0; z-index:2; background:rgba(255,255,255,.96); border-bottom:1px solid var(--line); padding:14px max(20px,calc((100% - 1120px)/2)); }
    h1 { margin:0 0 8px; font:700 1.25rem/1.2 Georgia,serif; }
    .toolbar,.actions,.meta,.filters { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .toolbar { justify-content:space-between; }
    button,select,input,textarea { font:inherit; }
    button,.file-label { border:1px solid var(--line); border-radius:7px; background:#fff; padding:8px 11px; cursor:pointer; }
    button:hover,.file-label:hover { border-color:var(--accent); }
    .primary { color:#fff; background:var(--accent); border-color:var(--accent); }
    .progress { min-width:180px; color:var(--muted); font-size:.9rem; }
    .bar { width:180px; height:7px; background:#e4e8eb; border-radius:5px; overflow:hidden; }
    .bar span { display:block; height:100%; background:var(--accent); }
    main { max-width:1120px; margin:20px auto; padding:0 20px 80px; display:grid; grid-template-columns:260px 1fr; gap:20px; }
    aside,.card { background:var(--paper); border:1px solid var(--line); border-radius:10px; }
    aside { padding:16px; align-self:start; position:sticky; top:105px; }
    aside label { display:block; margin:12px 0 4px; color:var(--muted); font-size:.88rem; }
    aside select,aside input { width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; }
    .counts { margin-top:16px; padding-top:12px; border-top:1px solid var(--line); font-size:.9rem; }
    .card { padding:28px 32px; min-height:600px; }
    .meta { color:var(--muted); font-size:.9rem; }
    h2 { font:700 1.55rem/1.3 Georgia,serif; margin:12px 0; }
    .abstract { margin:22px 0; white-space:pre-line; }
    .proposal { border-left:4px solid var(--accent); background:#f2f8fa; padding:12px 15px; margin:18px 0; }
    .decision button { min-width:130px; font-weight:650; }
    .decision button[data-value="INCLUDE"].selected { background:var(--include); color:#fff; }
    .decision button[data-value="BACKGROUND"].selected { background:var(--background); color:#fff; }
    .decision button[data-value="EXCLUDE"].selected { background:var(--exclude); color:#fff; }
    .fields { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:18px; }
    .fields label { color:var(--muted); font-size:.88rem; }
    .fields input,.fields textarea { width:100%; border:1px solid var(--line); border-radius:6px; padding:9px; display:block; }
    .fields .notes { grid-column:1/-1; }
    textarea { min-height:85px; resize:vertical; }
    .nav { display:flex; justify-content:space-between; margin-top:24px; }
    .saved { color:var(--include); font-size:.88rem; min-height:1.4em; }
    .file-label input { display:none; }
    kbd { background:#eef0f2; border:1px solid #ccd2d7; border-radius:4px; padding:1px 5px; }
    @media (max-width:760px) { main { grid-template-columns:1fr; } aside { position:static; } .card { padding:20px; } .fields { grid-template-columns:1fr; } .fields .notes { grid-column:auto; } }
  </style>
</head>
<body>
<div id="errorBanner" style="display:none;background:#fff0f0;color:#8b2020;padding:12px 20px;border-bottom:1px solid #d7a0a0"></div>
<header>
  <h1>__APP_TITLE__</h1>
  <div class="toolbar">
    <div class="progress"><span id="progressText"></span><div class="bar"><span id="progressBar"></span></div></div>
    <div class="actions">
      <label class="file-label">Importar progreso<input id="importFile" type="file" accept=".csv"></label>
      <button id="saveMatrixBtn" class="primary">Actualizar matriz</button>
      <button id="changeMatrixBtn" title="Seleccionar otro screening.csv">Cambiar matriz</button>
      <button id="exportBtn">Exportar copia</button>
    </div>
  </div>
</header>
<main>
  <aside>
    <strong>Filtrar registros</strong>
    <label for="statusFilter">Estado</label>
    <select id="statusFilter"><option value="all">Todos</option><option value="pending">Pendientes</option><option value="decided">Decididos</option></select>
    <label for="proposalFilter">Decisión propuesta</label>
    <select id="proposalFilter"><option value="all">Todas</option><option>PRIORITY_HIGH</option><option>PRIORITY_MEDIUM</option><option>PRIORITY_LOW</option><option>INCLUDE</option><option>BACKGROUND</option><option>EXCLUDE</option></select>
    <label for="search">Buscar</label><input id="search" type="search" placeholder="Título, autor, PMID…">
    <div class="counts" id="counts"></div>
    <p><small>Atajos: <kbd>1</kbd> incluir, <kbd>2</kbd> antecedente, <kbd>3</kbd> excluir, <kbd>←</kbd>/<kbd>→</kbd> navegar.</small></p>
    <p><small>Las decisiones se guardan automáticamente en este navegador. Exporta el CSV al terminar o para crear una copia de seguridad.</small></p>
  </aside>
  <section class="card" id="card">__FIRST_RECORD__</section>
</main>
<script>
const records = __SCREENING_DATA__;
const storageKey = '__STORAGE_KEY__';
const handleDbName = 'paris-ehis-screening-files';
const handleKey = '__HANDLE_KEY__';
const screeningFilename = '__SCREENING_FILENAME__';
let matrixHandle = null;
let storageAvailable = true, saved = {};
try { saved = JSON.parse(localStorage.getItem(storageKey) || '{}'); }
catch (error) { storageAvailable = false; }
let visible = [], position = 0;
const $ = id => document.getElementById(id);
const esc = value => String(value || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state = record => ({
  decision: saved[record.record_id]?.decision || record.investigator_decision || '',
  initials: saved[record.record_id]?.initials || record.investigator_initials || '',
  date: saved[record.record_id]?.date || record.confirmation_date || '',
  notes: saved[record.record_id]?.notes || record.investigator_notes || ''
});
function saveLocal() {
  if (!storageAvailable) return;
  try { localStorage.setItem(storageKey, JSON.stringify(saved)); }
  catch (error) { storageAvailable = false; }
}
function persist(record, patch) { saved[record.record_id] = {...state(record), ...patch}; saveLocal(); updateProgress(); }
function applyFilters(keepId) {
  const status=$('statusFilter').value, proposal=$('proposalFilter').value, q=$('search').value.toLowerCase();
  visible=records.filter(r => (status==='all'||(status==='pending')===!state(r).decision) && (proposal==='all'||r.proposed_decision===proposal) && (!q||[r.title,r.authors,r.pmid,r.abstract].join(' ').toLowerCase().includes(q)));
  position=Math.max(0, keepId ? visible.findIndex(r=>r.record_id===keepId) : 0); if(position<0) position=0; render();
}
function updateProgress() {
  const decisions=records.map(state).filter(s=>s.decision); $('progressText').textContent=`${decisions.length} de ${records.length} confirmados`;
  $('progressBar').style.width=`${100*decisions.length/records.length}%`;
  const n=d=>records.filter(r=>state(r).decision===d).length;
  $('counts').innerHTML=`Incluidos: <b>${n('INCLUDE')}</b><br>Antecedentes: <b>${n('BACKGROUND')}</b><br>Excluidos: <b>${n('EXCLUDE')}</b><br>Pendientes: <b>${records.length-decisions.length}</b>${storageAvailable?'':'<br><br><b>Guardado local no disponible:</b> exporta el CSV antes de cerrar.'}`;
}
function render() {
  updateProgress(); const card=$('card');
  if(!visible.length){card.innerHTML='<h2>No hay registros con estos filtros</h2>';return;}
  const r=visible[position], s=state(r);
  card.innerHTML=`<div class="meta"><span>${position+1} de ${visible.length}</span> · ID ${esc(r.pmid)} · ${esc(r.year)} · ${esc(r.journal)}</div>
    <h2>${esc(r.title)}</h2><div class="meta">${esc(r.authors)}</div>
    <p><a href="${esc(r.pubmed_url)}" target="_blank" rel="noopener">Abrir registro fuente ↗</a></p>
    <div class="abstract">${esc(r.abstract)||'<i>Sin resumen disponible.</i>'}</div>
    <div class="proposal"><b>Propuesta: ${esc(r.proposed_decision)}</b><br>${esc(r.proposed_reason)}</div>
    <div class="decision actions">${['INCLUDE','BACKGROUND','EXCLUDE'].map((d,i)=>`<button data-value="${d}" class="${s.decision===d?'selected':''}">${i+1}. ${d}</button>`).join('')}</div>
    <div class="fields"><label>Iniciales<input id="initials" value="${esc(s.initials)}"></label><label>Fecha<input id="date" type="date" value="${esc(s.date)}"></label><label class="notes">Notas<textarea id="notes">${esc(s.notes)}</textarea></label></div>
    <div class="saved" id="savedMsg"></div><div class="nav"><button id="prev">← Anterior</button><button id="next">Siguiente →</button></div>`;
  card.querySelectorAll('.decision button').forEach(b=>b.onclick=()=>decide(b.dataset.value));
  ['initials','date','notes'].forEach(id=>$(id).oninput=()=>{persist(r,{[id]:$(id).value});$('savedMsg').textContent='Guardado en el navegador';});
  $('prev').onclick=()=>move(-1); $('next').onclick=()=>move(1);
}
function decide(value){const r=visible[position], defaults={decision:value}; if(!state(r).date) defaults.date=new Date().toISOString().slice(0,10); persist(r,defaults); render();}
function move(delta){position=Math.min(Math.max(position+delta,0),visible.length-1);render();window.scrollTo({top:0,behavior:'smooth'});}
function csvCell(value){const s=String(value??'');return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function buildCsv(){const cols=['record_id','pmid','title','stage','proposed_decision','proposed_reason','proposed_reviewer','proposed_review_date','investigator_decision','investigator_initials','confirmation_date','investigator_notes']; const lines=[cols.join(',')]; records.forEach(r=>{const s=state(r),row={...r,investigator_decision:s.decision,investigator_initials:s.initials,confirmation_date:s.date,investigator_notes:s.notes};lines.push(cols.map(c=>csvCell(row[c])).join(','));});return '\ufeff'+lines.join('\r\n');}
function exportCsv(){const blob=new Blob([buildCsv()],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='screening-confirmed.csv';a.click();URL.revokeObjectURL(a.href);}
function openHandleDb(){return new Promise((resolve,reject)=>{const request=indexedDB.open(handleDbName,1);request.onupgradeneeded=()=>request.result.createObjectStore('handles');request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);});}
async function storeMatrixHandle(handle){try{const db=await openHandleDb();const tx=db.transaction('handles','readwrite');tx.objectStore('handles').put(handle,handleKey);await new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});db.close();}catch(error){/* The current session can still use the handle. */}}
async function loadMatrixHandle(){try{const db=await openHandleDb();const tx=db.transaction('handles','readonly');const request=tx.objectStore('handles').get(handleKey);matrixHandle=await new Promise((resolve,reject)=>{request.onsuccess=()=>resolve(request.result||null);request.onerror=()=>reject(request.error);});db.close();if(matrixHandle)$('saveMatrixBtn').textContent='Actualizar '+matrixHandle.name;}catch(error){matrixHandle=null;}}
async function chooseMatrix(){
  if(!window.showSaveFilePicker){alert('Este navegador no permite actualizar archivos directamente. Usa Edge o Chrome, o pulsa «Exportar copia».');return;}
  try{
    matrixHandle=await window.showSaveFilePicker({suggestedName:screeningFilename,types:[{description:'Archivo CSV',accept:{'text/csv':['.csv']}}]});
    await storeMatrixHandle(matrixHandle);$('saveMatrixBtn').textContent='Actualizar '+matrixHandle.name;return true;
  }catch(error){if(error.name!=='AbortError')alert('No se pudo actualizar la matriz: '+error.message);}
  return false;
}
async function saveMatrix(){
  if(!matrixHandle && !await chooseMatrix())return;
  try{
    let permission=await matrixHandle.queryPermission({mode:'readwrite'});
    if(permission!=='granted')permission=await matrixHandle.requestPermission({mode:'readwrite'});
    if(permission!=='granted')return alert('No se concedió permiso para actualizar la matriz.');
    const writable=await matrixHandle.createWritable();await writable.write(buildCsv());await writable.close();
    alert('Matriz actualizada directamente: '+matrixHandle.name);
  }catch(error){matrixHandle=null;$('saveMatrixBtn').textContent='Actualizar matriz';alert('Se perdió el acceso al archivo. Pulsa de nuevo para seleccionarlo: '+error.message);}
}
function parseCsv(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++;}else if(c==='"')quoted=false;else cell+=c;}else if(c==='"')quoted=true;else if(c===','){row.push(cell);cell='';}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell='';}else cell+=c;}if(cell||row.length){row.push(cell);rows.push(row);}return rows;}
function importCsv(file){const reader=new FileReader();reader.onload=()=>{const rows=parseCsv(reader.result.replace(/^\ufeff/,'')),head=rows.shift(),ix=Object.fromEntries(head.map((h,i)=>[h,i])); if(ix.record_id===undefined||ix.investigator_decision===undefined)return alert('El CSV no tiene las columnas esperadas.'); rows.forEach(row=>{const id=row[ix.record_id];if(!id)return;saved[id]={decision:row[ix.investigator_decision]||'',initials:row[ix.investigator_initials]||'',date:row[ix.confirmation_date]||'',notes:row[ix.investigator_notes]||''};});saveLocal();applyFilters();alert('Progreso importado.');};reader.readAsText(file,'UTF-8');}
['statusFilter','proposalFilter'].forEach(id=>$(id).onchange=()=>applyFilters(visible[position]?.record_id)); $('search').oninput=()=>applyFilters(); $('saveMatrixBtn').onclick=saveMatrix; $('changeMatrixBtn').onclick=async()=>{if(await chooseMatrix())await saveMatrix();}; $('exportBtn').onclick=exportCsv; $('importFile').onchange=e=>e.target.files[0]&&importCsv(e.target.files[0]);
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='1')decide('INCLUDE');if(e.key==='2')decide('BACKGROUND');if(e.key==='3')decide('EXCLUDE');if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);});
applyFilters();loadMatrixHandle();
</script>
</body>
</html>
